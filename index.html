<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Mobile UI</title>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-header">
                <span class="status-dot"></span>
                <h2 class="card-title">تصميم عصري</h2>
            </div>
            <p class="card-text">
                هذا التنسيق مصمم خصيصاً ليعمل بكفاءة على الهواتف الذكية، مع مراعاة واجهات العرض المختلفة.
            </p>
            <div class="card-actions">
                <button class="btn btn-primary">ابدأ الآن</button>
                <button class="btn btn-ghost">تخطي</button>
            </div>
        </div>
    </div>
</body>
</html>
