<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الجدول المدرسي المطور</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1e2f 0%, #252540 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-color: #6c5ce7;
            --radius-sm: 12px;
            --radius-lg: 24px;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 4vw;
            overflow-x: hidden;
        }

        .app-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .app-header h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .days-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .days-tabs::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .day-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .schedule-container {
            display: none;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.4s ease;
        }

        .schedule-container.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .period-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 1.2rem;
            box-shadow: var(--shadow-soft);
        }

        .period-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .period-number {
            background: var(--accent-color);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .period-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .class-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            padding: 10px;
            transition: transform 0.2s ease;
        }

        .class-box:active {
            transform: scale(0.96);
        }

        .class-name {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .subject {
            display: block;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #a29bfe;
        }

        .teacher {
            display: block;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .class-box.empty {
            opacity: 0.3;
        }
        
        /* تنسيق حصص النشاط لتكون بارزة جداً */
        .class-box.activity {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(46, 204, 113, 0.4);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        .class-box.activity .class-name {
            color: #2ecc71;
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
        }

        .class-box.activity .subject {
            display: none;
        }
    </style>
</head>

        function generateSchedule() {
            const daysMap = {
                "الأحد": "sunday",
                "الاثنين": "monday",
                "الثلاثاء": "tuesday",
                "الأربعاء": "wednesday",
                "الخميس": "thursday"
            };

            rawData.forEach(row => {
                const dayName = row[0];
                const periodName = row[1];
                const containerId = daysMap[dayName];
                const container = document.getElementById(containerId);

                let classesHTML = '';
                
                for (let i = 0; i < 16; i++) {
                    const subject = row[2 + (i * 2)];
                    const teacher = row[3 + (i * 2)];
                    const className = classes[i];

                    if (subject === "*" || subject === "") {
                        classesHTML += `
                            <div class="class-box empty">
                                <span class="class-name">${className}</span>
                                <span class="subject">ـ</span>
                            </div>
                        `;
                    } else if (subject === "النشاط") {
                        classesHTML += `
                            <div class="class-box activity">
                                <span class="class-name">حصة نشاط</span>
                            </div>
                        `;
                    } else {
                        classesHTML += `
                            <div class="class-box">
                                <span class="class-name">${className}</span>
                                <span class="subject">${subject}</span>
                                <span class="teacher">${teacher}</span>
                            </div>
                        `;
                    }
                }

                container.innerHTML += `
                    <div class="period-card">
                        <div class="period-header">
                            <span class="period-number">${getPeriodNumber(periodName)}</span>
                            <span class="period-title">الحصة ${periodName}</span>
                        </div>
                        <div class="classes-grid">
                            ${classesHTML}
                        </div>
                    </div>
                `;
            });
        }

        function getPeriodNumber(name) {
            const map = {"الأولى": 1, "الثانية": 2, "الثالثة": 3, "الرابعة": 4, "الخامسة": 5, "السادسة": 6, "السابعة": 7, "الثامنة": 8};
            return map[name] || '';
        }

        function showDay(dayId) {
            document.querySelectorAll('.schedule-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        generateSchedule();
