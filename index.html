<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برنامج المعلم - مدرسة أبي بكر الصديق</title>
    <style>
        :root {
            /* ألوان مشرقة وفاتحة */
            --bg-gradient: linear-gradient(135deg, #f4f7fb 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb; /* أزرق مشرق */
            --accent-hover: #1d4ed8;
            --radius-sm: 12px;
            --radius-lg: 20px;
            --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 4vw;
            overflow-x: hidden;
        }

        /* صندوق تسجيل الدخول / الاختيار */
        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 1.5rem;
            box-shadow: var(--shadow-soft);
            text-align: center;
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .login-box h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .login-box p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        select, button {
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid var(--glass-border);
            outline: none;
            transition: all 0.3s ease;
        }

        select {
            background: #f8fafc;
            color: var(--text-primary);
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        /* واجهة البرنامج */
        .schedule-view {
            display: none;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft);
        }

        .welcome-msg {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .welcome-msg span {
            color: var(--accent-color);
        }

        .logout-btn {
            width: auto;
            margin: 0;
            padding: 8px 16px;
            font-size: 0.85rem;
            background: #f1f5f9;
            color: var(--text-primary);
            box-shadow: none;
            border: 1px solid #cbd5e1;
        }

        .days-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }

        .days-tabs::-webkit-scrollbar { display: none; /* Chrome/Safari */ }

        .day-btn {
            background: #ffffff;
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            margin: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border: 1px solid var(--glass-border);
        }

        .day-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .schedule-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.4s ease;
            margin-bottom: 2rem;
        }

        .schedule-container.active {
            display: flex;
        }

        .day-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0.5rem 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #e2e8f0;
            display: inline-block;
            width: max-content;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* بطاقة الحصة للمعلم */
        .period-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 1.2rem;
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .period-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .period-number {
            background: #eff6ff;
            color: var(--accent-color);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            flex-shrink: 0;
            border: 1px solid #bfdbfe;
        }

        .period-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .class-details {
            text-align: left;
            direction: rtl;
        }

        .subject-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .class-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 3px;
        }

        /* حالة الفراغ */
        .period-card.free {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            box-shadow: none;
            opacity: 0.7;
        }

        .period-card.free .period-number {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
        }

        .period-card.free .subject-name {
            color: #64748b;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- واجهة اختيار المعلم -->
    <div id="loginView" class="login-box">
        <h1>برنامج المعلم</h1>
        <p>اختر اسمك من القائمة لعرض جدولك الأسبوعي</p>
        <select id="teacherSelect" onchange="autoLogin()">
            <option value="" disabled selected>-- اضغط لاختيار اسمك --</option>
        </select>
        <button onclick="saveMyName()">📌 حفظ اسمي لتسجيل الدخول التلقائي</button>
    </div>

    <!-- واجهة جدول المعلم -->
    <div id="scheduleView" class="schedule-view">
        <div class="header-bar">
            <div class="welcome-msg">أهلاً بك، <span id="teacherNameDisplay"></span></div>
            <button class="logout-btn" onclick="logout()">تغيير المعلم</button>
        </div>

        <div class="days-tabs">
            <button class="day-btn active" onclick="showDay('all', this)">كل الأسبوع</button>
            <button class="day-btn" onclick="showDay('sunday', this)">الأحد</button>
            <button class="day-btn" onclick="showDay('monday', this)">الاثنين</button>
            <button class="day-btn" onclick="showDay('tuesday', this)">الثلاثاء</button>
            <button class="day-btn" onclick="showDay('wednesday', this)">الأربعاء</button>
            <button class="day-btn" onclick="showDay('thursday', this)">الخميس</button>
        </div>

        <!-- أضفنا الكلاس active لكل الأيام لتظهر جميعها عند فتح "كل الأسبوع" -->
        <div id="sunday" class="schedule-container active"></div>
        <div id="monday" class="schedule-container active"></div>
        <div id="tuesday" class="schedule-container active"></div>
        <div id="wednesday" class="schedule-container active"></div>
        <div id="thursday" class="schedule-container active"></div>
    </div>

        const teachersList = new Set();
        rawData.forEach(row => {
            for (let i = 0; i < 16; i++) {
                const teacher = row[3 + (i * 2)];
                if (teacher && teacher !== "-" && teacher !== "*") {
                    teachersList.add(teacher);
                }
            }
        });

        const sortedTeachers = Array.from(teachersList).sort((a, b) => a.localeCompare(b, 'ar'));
        const select = document.getElementById('teacherSelect');
        
        sortedTeachers.forEach(teacher => {
            const option = document.createElement('option');
            option.value = teacher;
            option.textContent = teacher;
            select.appendChild(option);
        });

        window.onload = function() {
            const savedTeacher = localStorage.getItem('savedTeacherName');
            if (savedTeacher) {
                select.value = savedTeacher;
                login(savedTeacher);
            }
        }

        function autoLogin() {
            const teacherName = document.getElementById('teacherSelect').value;
            if (teacherName) {
                login(teacherName);
            }
        }

        function saveMyName() {
            const teacherName = document.getElementById('teacherSelect').value;
            if (!teacherName) {
                alert("الرجاء اختيار اسمك من القائمة أولاً لتثبيته.");
                return;
            }
            localStorage.setItem('savedTeacherName', teacherName);
            alert(`تم حفظ اسمك (${teacherName}) بنجاح. سيتم فتح جدولك مباشرة في المرات القادمة!`);
        }

        function login(teacherName) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('scheduleView').style.display = 'block';
            document.getElementById('teacherNameDisplay').textContent = teacherName;
            generateTeacherSchedule(teacherName);
        }

        function logout() {
            document.getElementById('scheduleView').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('teacherSelect').value = "";
        }

        function generateTeacherSchedule(teacherName) {
            const daysMap = {
                "الأحد": "sunday",
                "الاثنين": "monday",
                "الثلاثاء": "tuesday",
                "الأربعاء": "wednesday",
                "الخميس": "thursday"
            };

            Object.entries(daysMap).forEach(([arabicName, id]) => {
                const container = document.getElementById(id);
                container.innerHTML = `<div class="day-header">${arabicName}</div>`;
            });

            rawData.forEach(row => {
                const dayName = row[0];
                const periodName = row[1];
                const containerId = daysMap[dayName];
                const container = document.getElementById(containerId);

                if(!container) return;

                let teacherHasClass = false;
                let classInfo = null;

                for (let i = 0; i < 16; i++) {
                    const subject = row[2 + (i * 2)];
                    const teacher = row[3 + (i * 2)];
                    const className = classes[i];

                    if (teacher === teacherName) {
                        teacherHasClass = true;
                        classInfo = { subject, className };
                        break; 
                    }
                }

                if (teacherHasClass) {
                    container.innerHTML += `
                        <div class="period-card">
                            <div class="period-info">
                                <span class="period-number">${getPeriodNumber(periodName)}</span>
                                <span class="period-title">الحصة ${periodName}</span>
                            </div>
                            <div class="class-details">
                                <div class="subject-name">${classInfo.subject}</div>
                                <div class="class-name">${classInfo.className}</div>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="period-card free">
                            <div class="period-info">
                                <span class="period-number">${getPeriodNumber(periodName)}</span>
                                <span class="period-title">الحصة ${periodName}</span>
                            </div>
                            <div class="class-details">
                                <div class="subject-name">فراغ</div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function getPeriodNumber(name) {
            const map = {"الأولى": 1, "الثانية": 2, "الثالثة": 3, "الرابعة": 4, "الخامسة": 5, "السادسة": 6, "السابعة": 7, "الثامنة": 8};
            return map[name] || '';
        }

        function showDay(dayId, btn) {
            const containers = document.querySelectorAll('.schedule-container');
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (dayId === 'all') {
                containers.forEach(c => c.classList.add('active'));
            } else {
                containers.forEach(c => c.classList.remove('active'));
                document.getElementById(dayId).classList.add('active');
            }
        }
