  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white shadow-lg py-5 px-4">
    <div class="max-w-4xl mx-auto text-center space-y-1.5">
      <div class="inline-block bg-blue-800/50 px-3 py-0.5 rounded-full text-xs font-semibold text-blue-200">
        المملكة الأردنية الهاشمية • وزارة التربية والتعليم
      </div>
      <h1 class="text-xl sm:text-2xl font-black">مدرسة أبي بكر الصديق الأساسية للبنين</h1>
      <p class="text-xs sm:text-sm text-blue-200">جدول الحصص الأسبوعي — العام الدراسي 2026/2027</p>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 mt-5 space-y-5">

    <!-- Selector Box -->
    <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 no-print">
      <label for="teacherSelect" class="block text-xs sm:text-sm font-bold text-slate-700 mb-2">
        👤 اختر اسم المعلم:
      </label>
      <div class="flex flex-col sm:flex-row gap-3">
        <select id="teacherSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm sm:text-base font-bold focus:ring-2 focus:ring-blue-600 focus:outline-none transition">
          <option value="">-- اضغط لاختيار اسمك --</option>
        </select>
        <button id="saveMyNameBtn" class="whitespace-nowrap px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-1 shadow-sm">
          📌 تثبيت اسمي
        </button>
      </div>
    </div>

    <!-- Teacher Summary Card -->
    <div id="teacherCard" class="hidden bg-white rounded-2xl p-5 shadow-sm border-r-4 border-r-blue-600 border border-slate-200 space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
        <div>
          <span class="text-xs text-slate-400 font-semibold block">المعلم:</span>
          <h2 id="tName" class="text-lg sm:text-xl font-black text-blue-950"></h2>
        </div>
        <div class="bg-blue-50 text-blue-800 px-3 py-1 rounded-lg text-xs sm:text-sm font-black border border-blue-200">
          النصاب: <span id="tTotal"></span> حصة
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs sm:text-sm text-slate-600">
        <div><strong class="text-slate-800">المواد:</strong> <span id="tSubjects"></span></div>
        <div><strong class="text-slate-800">الشعب:</strong> <span id="tSections"></span></div>
      </div>
    </div>

    <!-- Day Filter Buttons -->
    <div id="dayFilterContainer" class="hidden flex flex-wrap items-center gap-1.5 no-print">
      <span class="text-xs font-bold text-slate-500 ml-1">عرض:</span>
      <button onclick="filterDay('all')" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-blue-700 text-white transition shadow-sm" data-day="all">الأسبوع كاملاً</button>
      <button onclick="filterDay('الأحد')" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 transition" data-day="الأحد">الأحد</button>
      <button onclick="filterDay('الاثنين')" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 transition" data-day="الاثنين">الاثنين</button>
      <button onclick="filterDay('الثلاثاء')" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 transition" data-day="الثلاثاء">الثلاثاء</button>
      <button onclick="filterDay('الأربعاء')" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 transition" data-day="الأربعاء">الأربعاء</button>
      <button onclick="filterDay('الخميس')" class="day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 transition" data-day="الخميس">الخميس</button>
    </div>

    <!-- Schedule Results -->
    <div id="scheduleContainer" class="space-y-4"></div>

    <!-- Print / Export Button -->
    <div id="actionsContainer" class="hidden text-center pt-2 no-print">
      <button onclick="window.print()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs sm:text-sm font-bold shadow transition">
        🖨️ طباعة الجدول / حفظ PDF
      </button>
    </div>

    // Populate Select Dropdown
    const selectElem = document.getElementById('teacherSelect');
    Object.keys(teachersData).sort().forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = `${name} (${teachersData[name].total} حصة)`;
      selectElem.appendChild(opt);
    });

    // Load saved teacher
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('savedTeacherName');
      if (savedName && teachersData[savedName]) {
        selectElem.value = savedName;
        renderTeacherSchedule(savedName);
      }
    });

    document.getElementById('saveMyNameBtn').addEventListener('click', () => {
      const selected = selectElem.value;
      if (!selected) {
        alert('يرجى اختيار اسم المعلم أولاً!');
        return;
      }
      localStorage.setItem('savedTeacherName', selected);
      alert(`تم تثبيت اسم (${selected}) بنجاح!`);
    });

    selectElem.addEventListener('change', (e) => {
      const name = e.target.value;
      if (name) {
        renderTeacherSchedule(name);
      } else {
        document.getElementById('teacherCard').classList.add('hidden');
        document.getElementById('dayFilterContainer').classList.add('hidden');
        document.getElementById('scheduleContainer').innerHTML = '';
        document.getElementById('actionsContainer').classList.add('hidden');
      }
    });

    let currentSelectedTeacher = null;
    let currentFilterDay = 'all';

    function renderTeacherSchedule(name) {
      currentSelectedTeacher = name;
      const data = teachersData[name];
      if (!data) return;

      document.getElementById('tName').textContent = name;
      document.getElementById('tTotal').textContent = data.total;
      document.getElementById('tSubjects').textContent = data.subjects;
      document.getElementById('tSections').textContent = data.sections;

      document.getElementById('teacherCard').classList.remove('hidden');
      document.getElementById('dayFilterContainer').classList.remove('hidden');
      document.getElementById('actionsContainer').classList.remove('hidden');

      renderScheduleView();
    }

    function filterDay(day) {
      currentFilterDay = day;
      document.querySelectorAll('.day-btn').forEach(btn => {
        if (btn.dataset.day === day) {
          btn.className = 'day-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-blue-700 text-white transition shadow-sm';
        } else {
          btn.className = 'day-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 transition';
        }
      });
      renderScheduleView();
    }

    function renderScheduleView() {
      if (!currentSelectedTeacher) return;
      const tData = teachersData[currentSelectedTeacher];
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      const daysToRender = (currentFilterDay === 'all') ? daysOrder : [currentFilterDay];

      daysToRender.forEach(day => {
        const daySchedule = tData.schedule[day];
        let periodsHtml = '';
        let dayCount = 0;

        periodTimings.forEach(timing => {
          const lesson = daySchedule[timing.p.toString()] || '';
          if (lesson) {
            dayCount++;
            periodsHtml += `
              <div class="flex items-center justify-between p-3 rounded-xl bg-blue-50/80 border border-blue-200">
                <span class="text-xs font-black text-blue-900 bg-blue-200/70 px-2 py-0.5 rounded-md">${timing.label}</span>
                <span class="text-sm font-extrabold text-slate-800">${lesson}</span>
              </div>
            `;
          } else {
            periodsHtml += `
              <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/50 opacity-60">
                <span class="text-xs font-semibold text-slate-500">${timing.label}</span>
                <span class="text-xs text-slate-400 font-medium">-- فراغ --</span>
              </div>
            `;
          }
        });

        const dayCard = document.createElement('div');
        dayCard.className = 'bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 space-y-3';
        dayCard.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h3 class="text-sm sm:text-base font-black text-slate-800 flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span> ${day}
            </h3>
            <span class="text-xs font-bold text-blue-700 bg-blue-100 px-2.5 py-0.5 rounded-md">
              ${dayCount} حصص
            </span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${periodsHtml}
          </div>
        `;
        container.appendChild(dayCard);
      });
    }
